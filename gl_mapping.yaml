    class: "0030-COUNTRY STORE"

# Tax Details rows matching this pattern (case-insensitive) are informational
# only and never get a GL line, per CLAUDE.md section 3.
no_tax_labels:
  - "No Tax"

description:
  # Full memo repeated on every line, per CLAUDE.md section 6:
  #   "Country Store Daily Revenue {D Month YYYY}"
  memo_template: "Country Store Daily Revenue {date}"
  # When true, every line gets its prefix even if the account doesn't repeat
  # in this particular entry. CLAUDE.md's default is false - Country Store
  # only prefixes lines that need disambiguation (the three 1007 tender
  # lines, Seasonal Items, Unclassified, Refunds-Allowances) or whose account
  # actually repeats in that day's entry.
  always_label: false
