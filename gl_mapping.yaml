# =============================================================================
# Country Store GL mapping — the ONLY place account/Class/sign rules live.
#
# Nobody should ever need to touch countrystore_je.py or mprje_cs/*.py to fix
# a mapping or add a brand-new Clover code. Edit THIS file instead.
#
# HOW TO ADD A NEW REVENUE CATEGORY
# ----------------------------------
# Under `revenue_classes:`, add a new key. The key must match the category
# name EXACTLY as Clover prints it in the "Revenue Classes" table (case
# sensitive is not required — matching is case-insensitive — but spelling
# must match). Example:
#
#   "New Category Name":
#     account: "3099 Revenue - Something New"   # exact QBO Chart of Accounts name
#     class: "0030-COUNTRY STORE"                # QBO Class (almost always this)
#     prefix: "New Category Name - "             # optional; only needed if this
#                                                 # account name repeats elsewhere
#                                                 # in the same entry, or if you
#                                                 # always want a label (see
#                                                 # description.always_label below)
#
# If Clover ever adds an account NOT in the QBO Chart of Accounts yet, do NOT
# guess a number — get the real account name from QBO/accounting first, then
# add it here. Until it exists here, unmapped lines fall back to
# `unmapped_default` below and get flagged (never dropped, never silently
# guessed).
#
# HOW TO ADD/CHANGE A TENDER TYPE
# ----------------------------------
# Under `tenders:`, same shape as above. `account` is a debit account (money
# coming in via that tender). Match the tender name exactly as Clover prints
# it in "Tender Types" / "Sales By Card Type".
#
# HOW TO ADD/CHANGE A TAX LINE
# ----------------------------------
# Under `taxes:`, one entry per tax row that appears in the Tax Details
# table. "No Tax (0%)" rows are intentionally NOT mapped here — they are
# informational only and never get their own GL line (already reflected in
# revenue category Net Sales).
#
# SIGN CONVENTION
# ----------------------------------
# Everything in this file posts the "natural" way for Country Store:
#   - Revenue categories & tax lines -> CREDIT
#   - Tender lines (cards, cash, gift certs, room charge) -> DEBIT
# Nothing here flips sign. If a future line item genuinely needs the
# opposite of its category's default side, do NOT hack the code — add an
# explicit `side: debit` / `side: credit` override key next to that entry
# and note why in a comment right there.
# =============================================================================

class_default: "0030-COUNTRY STORE"

# Country Store's own version of the "unmapped line" placeholder (see build
# instructions section 8 / CLAUDE.md special cases). Never invented from
# nothing — this is confirmed as the same default Accommodation uses.
unmapped_default:
  account: "3029 Miscellaneous Revenue"
  class: "0030-COUNTRY STORE"
  prefix: "Unclassified - "

# Dedicated contra account for the ambiguous-refund special case (CLAUDE.md
# section 4, "Refunds — the ambiguous/unclean case"). Debit this, never fold
# a negative Unclassified figure into 3029.
refunds_allowances:
  account: "Refunds-Allowances"
  class: "0030-COUNTRY STORE"
  prefix: "Refunds-Allowances - "

