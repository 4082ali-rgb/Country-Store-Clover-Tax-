    class: "0030-COUNTRY STORE"
    prefix: "Debit - "

  "Debit":
    account: "1007 Visa / Mstrcrd / Debit Receivable"
    class: "0030-COUNTRY STORE"
    prefix: "Debit - "

  "Visa":
    account: "1007 Visa / Mstrcrd / Debit Receivable"
    class: "0030-COUNTRY STORE"
    prefix: "Visa - "

  "MasterCard":
    account: "1007 Visa / Mstrcrd / Debit Receivable"
    class: "0030-COUNTRY STORE"
    prefix: "MasterCard - "

  "Mastercard":
    account: "1007 Visa / Mstrcrd / Debit Receivable"
    class: "0030-COUNTRY STORE"
