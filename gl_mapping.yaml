    class: "0030-COUNTRY STORE"
    prefix: "Seasonal Items - "

  "Hard Goods":
    account: "3021 Revenue - Miscellaneous Retail"
    class: "0030-COUNTRY STORE"
    prefix: "Seasonal Items - "

