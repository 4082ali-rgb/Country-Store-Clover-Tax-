    class: "0030-COUNTRY STORE"

  "Non Alcoholic Beverages":
    account: "3006 Revenue - Non-Alcoholic"
    class: "0030-COUNTRY STORE"

  "Alcohol Beverages":
    account: "3003 Revenue - Liquor"
    class: "0030-COUNTRY STORE"

  "Grocery":
    account: "3013 Revenue - Grocery"
    class: "0030-COUNTRY STORE"

  "Tobacco":
    account: "3017 Revenue - Tobacco"
    class: "0030-COUNTRY STORE"

  "Ice":
